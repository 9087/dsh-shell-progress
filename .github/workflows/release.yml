name: Release

# Fires on the tag `release-it` pushes. Publishing uses npm Trusted Publishing
# (OIDC), so there is no NPM_TOKEN secret anywhere — see PUBLISH.md for the
# one-time npmjs.com setup this depends on.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: npm publish --provenance
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
