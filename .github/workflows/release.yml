name: Release

# Fires on the tag `release-it` pushes. Publishing uses npm Trusted Publishing
# (OIDC), so there is no NPM_TOKEN secret anywhere — see PUBLISH.md for the
# one-time npmjs.com setup this depends on.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # Build before test: the client-bundle suite runs the built `lib/client.js`.
      - run: pnpm run build
      - run: pnpm test
      - run: npm publish --provenance
      # Verify what the REGISTRY serves, before the release is announced: every gate above
      # this one looked at `src/` and at `lib/`, neither of which is the artifact users
      # install. The version is absent for a while after a publish, so the script polls;
      # it exits non-zero if the tarball is missing a promised file, if the record was
      # built from another commit, or if the published client bundle cannot render a
      # card — in which case the GitHub Release below never goes out. `git rev-parse HEAD`
      # rather than `github.sha`: the checkout is already at the tag's commit, and an
      # annotated tag's own object hash is not what npm records as `gitHead`.
      - run: node scripts/verify-release.mjs "${{ github.ref_name }}" --expect-git-head "$(git rev-parse HEAD)"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
