name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The PowerShell semantics suite skips itself on a host with no shell
      # (Linux runners have `pwsh` via the image; when it is absent the suite
      # reports skips rather than failures).
      - run: pnpm test
      - run: pnpm run build
